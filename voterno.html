<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভোটার নম্বর</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f6ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px 80px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1a4fa3;
            font-size: 48px;
            margin: 0;
            letter-spacing: 1px;
        }

        .loader {
            margin-top: 20px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #1a4fa3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        .back-btn {
            margin-top: 30px;
            display: block;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            color: #1a4fa3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>কার্যক্রম প্রক্রিয়াধীন...</h1>
        <div class="loader"></div>
        <a href="index.html" class="back-btn">← ফিরে যান</a>
    </div>

</body>
</html>
